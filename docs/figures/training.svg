<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330"><rect width="1180" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d4c48"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="24" y="30" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a">(a) What one rollout looks like to the trainer</text><rect x="24" y="52" width="247" height="40" rx="4" fill="#efefec"/><text x="147.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">system + tools + greeting + opening</text><rect x="274" y="52" width="117" height="40" rx="4" fill="#2a78d6"/><text x="332.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">assistant: tool call</text><text x="332.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2a78d6">mask 1</text><rect x="394" y="52" width="117" height="40" rx="4" fill="#dddcd6"/><text x="452.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">tool results</text><text x="452.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#8a8984">mask 0</text><rect x="514" y="52" width="117" height="40" rx="4" fill="#2a78d6"/><text x="572.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">assistant: question</text><text x="572.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2a78d6">mask 1</text><rect x="634" y="52" width="107" height="40" rx="4" fill="#dddcd6"/><text x="687.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">customer reply</text><text x="687.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#8a8984">mask 0</text><rect x="744" y="52" width="107" height="40" rx="4" fill="#2a78d6"/><text x="797.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">assistant: recap</text><text x="797.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2a78d6">mask 1</text><rect x="854" y="52" width="87" height="40" rx="4" fill="#dddcd6"/><text x="897.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">customer “yes”</text><text x="897.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#8a8984">mask 0</text><rect x="944" y="52" width="107" height="40" rx="4" fill="#2a78d6"/><text x="997.5" y="77" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="middle" font-weight="normal" font-style="normal" fill="#ffffff">assistant: write</text><text x="997.5" y="110" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="normal" fill="#2a78d6">mask 1</text><text x="149" y="110" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11.5" text-anchor="middle" font-weight="normal" font-style="italic" fill="#8a8984">rendered once</text><text x="24" y="140" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">Sampled tokens are kept exactly as vLLM produced them; tool results and customer replies are appended as new tokens, never re-rendered,</text><text x="24" y="158" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">so the trainer scores the same ids the sampler did. The loss covers only the policy's own tokens (mask 1).</text><text x="24" y="196" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a">(b) One GRPO group: 8 rollouts of the same task, same customer seed</text><line x1="50" y1="306" x2="428" y2="306" stroke="#d9d8d3"/><path d="M60,306 L60,230.0 Q60,226.0 64,226.0 L86,226.0 Q90,226.0 90,230.0 L90,306 Z" fill="#2a78d6"/><text x="75" y="221.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">1.0</text><path d="M106,306 L106,254.0 Q106,250.0 110,250.0 L132,250.0 Q136,250.0 136,254.0 L136,306 Z" fill="#2a78d6"/><text x="121" y="245.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">0.7</text><path d="M152,306 L152,230.0 Q152,226.0 156,226.0 L178,226.0 Q182,226.0 182,230.0 L182,306 Z" fill="#2a78d6"/><text x="167" y="221.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">1.0</text><path d="M198,306 L198,294.0 Q198,290.0 202,290.0 L224,290.0 Q228,290.0 228,294.0 L228,306 Z" fill="#eb6834"/><text x="213" y="285.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">0.2</text><path d="M244,306 L244,308.5 Q244,304.5 248,304.5 L270,304.5 Q274,304.5 274,308.5 L274,306 Z" fill="#eb6834"/><text x="259" y="299.5" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">0.0</text><path d="M290,306 L290,230.0 Q290,226.0 294,226.0 L316,226.0 Q320,226.0 320,230.0 L320,306 Z" fill="#2a78d6"/><text x="305" y="221.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">1.0</text><path d="M336,306 L336,302.0 Q336,298.0 340,298.0 L362,298.0 Q366,298.0 366,302.0 L366,306 Z" fill="#eb6834"/><text x="351" y="293.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">0.1</text><path d="M382,306 L382,230.0 Q382,226.0 386,226.0 L408,226.0 Q412,226.0 412,230.0 L412,306 Z" fill="#2a78d6"/><text x="397" y="221.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#4d4c48">1.0</text><line x1="50" y1="256.0" x2="428" y2="256.0" stroke="#1a1a1a" stroke-dasharray="4 3"/><text x="434" y="260.0" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">group mean 0.62</text><text x="560" y="232" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="14" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a">advantage  Aᵢ = Rᵢ − mean(R)</text><text x="560" y="254" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">blue rollouts are pushed up, orange pushed down (no std scaling).</text><text x="560" y="274" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">The scripted customer is deterministic, so differences in a group come</text><text x="560" y="292" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">only from the policy. Groups where all 8 rewards are equal carry no</text><text x="560" y="310" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="12.5" text-anchor="start" font-weight="normal" font-style="normal" fill="#4d4c48">signal and are masked out of the loss.</text></svg>
