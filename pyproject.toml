[project]
name = "tau-forge"
version = "0.1.0"
description = "RLVR fine-tuning of Qwen3-4B on synthetic multi-step tool-calling scenarios grounded in tau2-bench retail"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
]

[project.optional-dependencies]
# Phase 7 GPU training stack. Deliberately NOT part of the default `uv sync` --
# this repo is developed in GPU-less environments and these packages need a
# matching CUDA toolchain to install. On the Phase 7 GPU box:
# `uv sync --extra train`. See docs/phase7_aws_setup.md.
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "vllm>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tau_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
