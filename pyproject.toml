[project]
name = "tau-forge"
version = "0.1.0"
description = "RLVR fine-tuning of Qwen3-4B on synthetic multi-step tool-calling scenarios grounded in tau2-bench retail"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tau_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
